name: Release

# Deliberately generic: every fact about which CLI is bundled and which upstream asset serves
# each target lives in `bundle.config.ts`, and the packaging itself in `scripts/package.ts`. This
# file should be copyable to another agent plugin unchanged.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build
        run: deno task build

      # Writes dist/packages/*.orax (one per declared target) and dist/manifest.toml.
      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: deno task package --tag "${{ github.ref_name }}" --repo "${{ github.repository }}"

      - name: Create Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/packages/*.orax dist/manifest.toml \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  # A direct call, not the `release` event: `gh release create` above uses this run's own
  # `GITHUB_TOKEN`, and GitHub does not fire `release` events for another workflow to catch when
  # the actor is the token of the same run — that would be a recursive trigger. Guarded the same
  # way as the release step itself: a non-tag ref (a manual dispatch on a branch, say) never
  # created a release for this to publish.
  publish:
    needs: release
    if: needs.release.result == 'success' && github.ref_type == 'tag'
    permissions:
      contents: read
    uses: ./.github/workflows/marketplace.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
