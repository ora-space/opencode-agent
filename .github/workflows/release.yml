name: Release

# Deliberately generic: every fact about which CLI is bundled and which upstream asset serves
# each target lives in `bundle.config.ts`, and the packaging itself in `scripts/package.ts`. This
# file should be copyable to another agent plugin unchanged.
#
# Two things reach this workflow, and they are deliberately the same path: a maintainer pushing a
# tag for a change to the plugin itself, and `upstream.yml` calling it after a new OpenCode
# release appears upstream. Everything about what gets bundled lives in `upstream.lock.json` and
# `bundle.config.ts`, so this file states only how a release is made, never what is in it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}
  workflow_call:
    inputs:
      tag:
        description: The tag to build and publish, which must already exist.
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # `inputs.tag` is empty for a pushed tag, and `github.ref` is that tag's ref, so one
      # expression serves both entry points.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Ora installs a package under the version inside it, not the one in the release title, so a
      # tag disagreeing with the manifest would publish an artifact that installs as something
      # else. Failing here is the last point at which that is still cheap to fix. It also doubles
      # as the guard against a `workflow_dispatch` run on a branch: `github.ref_name` there is a
      # branch name, which never matches `v${VERSION}`.
      - name: Check the tag matches the manifest
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version *=' orax.toml | sed -E 's/^version *= *"(.*)"/\1/')
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::tag ${TAG} does not match orax.toml version ${VERSION}"
            echo "::error::bump orax.toml to ${TAG#v}, then tag that commit"
            exit 1
          fi
          echo "releasing ${TAG} (orax.toml version ${VERSION})"

      - name: Build
        run: deno task build

      # Writes dist/packages/*.orax (one per declared target) and dist/manifest.toml, reproducing
      # exactly what upstream.lock.json records rather than resolving anything itself.
      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: deno task package --tag "$TAG" --repo "${{ github.repository }}"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            dist/packages/*.orax dist/manifest.toml \
            --title "$TAG" \
            --generate-notes

  # A direct call, not the `release` event: `gh release create` above uses this run's own
  # `GITHUB_TOKEN`, and GitHub does not fire `release` events for another workflow to catch when
  # the actor is the token of the same run — that would be a recursive trigger. `needs: release`
  # both orders this after the release exists and skips it if that job failed.
  publish:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/marketplace.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
