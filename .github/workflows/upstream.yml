name: Upstream

# Watches upstream for a new OpenCode CLI release and publishes a new version of this plugin
# whenever one appears. Which upstream that is — a pinned npm distribution, or the latest GitHub
# release — is `bundle.config.ts`'s choice; this workflow only acts on what `deno task sync`
# resolved.
#
# The release itself is not duplicated here: this workflow calls `release.yml`, which is also what
# a maintainer's own tag runs. That is not only to avoid repeating the steps — a tag pushed with
# the built-in `GITHUB_TOKEN` deliberately does not start another workflow run, so a design where
# this job only pushed a tag and expected `release.yml` to notice would tag every upstream bump
# and never publish any of them.

on:
  schedule:
    # 02:00 Beijing time, which is 18:00 UTC the day before — GitHub schedules in UTC only. Late
    # enough that a bad release is found by a maintainer in the morning rather than by a user.
    - cron: "0 18 * * *"
  # Gives the workflow a "Run workflow" button in the Actions tab, for checking upstream without
  # waiting for the nightly run.
  workflow_dispatch: {}

permissions:
  contents: write

# One at a time: two overlapping runs would both see the same upstream release, and the second
# would try to tag a version the first had already published.
concurrency:
  group: upstream-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      behind: ${{ steps.check.outputs.behind }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # `sync --check` resolves the upstream `bundle.config.ts` names (a pinned npm distribution,
      # or the latest GitHub release) and compares it against the whole lock, not just the version:
      # upstream could republish a release's assets without moving it, and that would be the
      # hardest kind of difference to notice later. Exit 20 is "behind"; anything else non-zero is
      # a real failure and must not be read as "nothing to do".
      - name: Check for a new OpenCode release
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=0
          deno task sync --check || code=$?
          case "$code" in
            0) echo "behind=false" >> "$GITHUB_OUTPUT" ;;
            20) echo "behind=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::sync --check failed with $code"; exit "$code" ;;
          esac

      - name: Pin the new upstream and bump the plugin version
        id: bump
        if: steps.check.outputs.behind == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deno task sync

          # This plugin's version is its own: it counts releases of this package, and an upstream
          # bump is one of the things that causes one. It deliberately does not mirror OpenCode's
          # own tag, which moves for reasons that have nothing to do with this plugin. A suffixed
          # line bumps the trailing counter of its suffix instead (`0.7.0-opencode2.1` ->
          # `0.7.0-opencode2.2`); `scripts/bump-version.ts` owns that rule and is tested, so this
          # step never does arithmetic on a version string itself.
          NEXT=$(deno task bump-version)
          TAG="v${NEXT}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::${TAG} already exists; the version was bumped without a release"
            exit 1
          fi

          UPSTREAM_TAG=$(jq -r '.tag' upstream.lock.json)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tagging ${TAG} for upstream ${UPSTREAM_TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orax.toml upstream.lock.json
          git commit -m "Bundle opencode ${UPSTREAM_TAG}"
          # The tag is pushed before the release runs so `release.yml` has something to check out,
          # and both are pushed together so a failure cannot leave a tag with no commit behind it.
          git tag "${TAG}"
          git push origin HEAD "${TAG}"

  release:
    needs: check
    if: needs.check.outputs.behind == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
    permissions:
      contents: write
    # Secrets do not flow through nested reusable-workflow calls on their own: `release.yml`
    # passes `secrets: inherit` on to `marketplace.yml`, but it can only pass on what it was given
    # here. Without this line the marketplace credentials are empty two levels down and the
    # publish job skips the pull request with only a warning, so the run still shows green.
    secrets: inherit
